<!DOCTYPE html>
<html>
<head>
    <title>View Patients</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <div class="header"><h2>🏥 Delight Sun Hospital</h2></div>
    <h1>👥 Patient Records</h1>

    {% if patients %}
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
            <th>Mobile</th>
        </tr>
        {% for p in patients %}
        <tr>
            <td>{{ p[0] }}</td>
            <td>{{ p[1] }}</td>
            <td>{{ p[2] }}</td>
            <td>{{ p[3] }}</td>
            <td>{{ p[4] }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p style="color:red; text-align:center;">
    ❌ No Patients Found!</p>
    {% endif %}

    <br>
    <a href="/admin"><button class="back">⬅ Go Back</button></a>
</div>
</body>
</html>
