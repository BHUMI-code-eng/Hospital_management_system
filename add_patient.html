<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <div class="header"><h2>🏥 Delight Sun Hospital</h2></div>
    <h1>➕ Add New Patient</h1>

    {% if msg %}
    <p class="msg">{{ msg }}</p>
    {% endif %}

    <div class="form-group">
        <form method="POST">
            <input type="text" name="name" 
            placeholder="👤 Patient Full Name" required><br>

            <input type="number" name="age" 
            placeholder="🎂 Patient Age" required><br>

            <input type="text" name="city" 
            placeholder="🏙️ Patient City" required><br>

            <input type="text" name="mobile" 
            placeholder="📱 Mobile Number" required><br>

            <button type="submit">➕ Add Patient</button>
        </form>
    </div>
    <br>
    <a href="/admin"><button class="back">⬅ Go Back</button></a>
</div>
</body>
</html>
